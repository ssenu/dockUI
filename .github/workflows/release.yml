name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
      - name: Test
        run: cargo test --locked
      - name: Set version from tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = $env:TAG.TrimStart("v")
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "잘못된 태그 형식: $env:TAG" }
          # Cargo.toml [package] 버전을 태그에 맞춘다 (첫 번째 version 줄)
          $file = "Cargo.toml"
          $text = Get-Content $file -Raw
          $regex = [regex]'(?m)^version = "[^"]*"'
          $text = $regex.Replace($text, "version = `"$version`"", 1)
          Set-Content $file $text -Encoding utf8NoBOM -NoNewline
          $meta = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $actual = ($meta.packages | Where-Object name -eq "yt-launcher").version
          if ($actual -ne $version) { throw "Cargo.toml 버전 반영 실패: $actual" }
          "APP_VERSION=$version" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install Inno Setup
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
      - name: Build installer
        run: ./scripts/build.ps1 -Version $env:APP_VERSION
      - name: Check asset names
        run: |
          $dir = "dist/installer"
          $setup = "YT-Launcher-Setup-$env:APP_VERSION.exe"
          if (-not (Test-Path "$dir/$setup")) { throw "설치 파일 이름이 규칙과 다릅니다" }
          $line = (Get-Content "$dir/SHA256SUMS.txt" -Raw).Trim()
          if ($line -notmatch "^[0-9a-f]{64}  $([regex]::Escape($setup))$") { throw "SHA256SUMS.txt 형식 오류: $line" }
      - name: Release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # 이전 태그 이후 커밋 제목을 바뀐 점 목록으로 (앱의 업데이트 확인 창에 요약해 보인다)
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $prev = git describe --tags --abbrev=0 "$env:TAG^" 2>$null
          $range = if ($LASTEXITCODE -eq 0 -and $prev) { "$prev..$env:TAG" } else { $env:TAG }
          $lines = git log $range --no-merges --pretty=format:"- %s"
          "## 바뀐 점`n`n" + ($lines -join "`n") | Set-Content release-notes.md -Encoding utf8NoBOM
          Get-Content release-notes.md
          $global:LASTEXITCODE = 0
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/installer/YT-Launcher-Setup-${{ env.APP_VERSION }}.exe
            dist/installer/SHA256SUMS.txt
          fail_on_unmatched_files: true
          body_path: release-notes.md
          generate_release_notes: true
